<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRT AI Translator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); width: 100%; max-width: 800px; }
        h2 { color: #1a73e8; text-align: center; margin-bottom: 25px; }
        .upload-section { border: 2px dashed #ccc; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; transition: 0.3s; }
        .upload-section:hover { border-color: #1a73e8; }
        textarea { width: 100%; height: 300px; border: 1px solid #ddd; border-radius: 8px; padding: 15px; font-size: 14px; resize: vertical; margin-top: 15px; box-sizing: border-box; }
        .controls { display: flex; gap: 10px; margin-top: 15px; }
        button { flex: 1; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #translateBtn { background: #28a745; color: white; }
        #translateBtn:disabled { background: #ccc; cursor: not-allowed; }
        #downloadBtn { background: #007bff; color: white; display: none; }
        .status { margin-top: 15px; font-size: 14px; color: #555; text-align: center; }
        .loader { display: none; margin: 10px auto; border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 24px; height: 24px; animation: spin 2s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="container">
    <h2>🇲🇲 AI Subtitle Translator</h2>
    
    <div class="upload-section">
        <input type="file" id="fileInput" accept=".srt">
        <p style="font-size: 12px; color: #888;">SRT format ဖိုင်ကို ရွေးချယ်ပါ</p>
    </div>

    <div class="controls">
        <button id="translateBtn" onclick="startTranslation()">ဘာသာပြန်မည်</button>
        <button id="downloadBtn" onclick="downloadSRT()">ဖိုင်ဒေါင်းလုဒ်ဆွဲမည်</button>
    </div>

    <div class="loader" id="loader"></div>
    <div id="status" class="status"></div>

    <textarea id="result" readonly placeholder="ဘာသာပြန်ပြီးသား စာတန်းများ ဤနေရာတွင် ပေါ်လာမည်..."></textarea>
</div>

<script>
    let translatedContent = "";

    async function startTranslation() {
        const fileInput = document.getElementById('fileInput');
        const status = document.getElementById('status');
        const loader = document.getElementById('loader');
        const btn = document.getElementById('translateBtn');
        const resultArea = document.getElementById('result');
        const downloadBtn = document.getElementById('downloadBtn');

        if (!fileInput.files[0]) return alert("ဖိုင်အရင်ရွေးပါ!");

        const reader = new FileReader();
        reader.readAsText(fileInput.files[0]);
        
        reader.onload = async function() {
            btn.disabled = true;
            loader.style.display = "block";
            status.innerText = "ဘာသာပြန်နေပါပြီ... ဖိုင်အရွယ်အစားပေါ်မူတည်၍ ကြာနိုင်ပါသည် (Chunking mode)";
            resultArea.value = "";

            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ srtData: reader.result })
                });

                const resData = await response.json();

                if (resData.success) {
                    translatedContent = resData.srt;
                    resultArea.value = translatedContent;
                    status.innerText = "✅ ဘာသာပြန်ခြင်း အောင်မြင်ပါသည်။";
                    downloadBtn.style.display = "block";
                } else {
                    throw new Error(resData.error);
                }
            } catch (err) {
                status.innerText = "❌ Error: " + err.message;
            } finally {
                btn.disabled = false;
                loader.style.display = "none";
            }
        };
    }

    function downloadSRT() {
        if (!translatedContent) return;
        const blob = new Blob([translatedContent], { type: 'text/plain' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = "translated_myanmar.srt";
        a.click();
    }
</script>

</body>
</html>
